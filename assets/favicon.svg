<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E2A9"/>
      <stop offset="50%" stop-color="#E5BD75"/>
      <stop offset="100%" stop-color="#A78045"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241B0E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#292929" stroke-width="1.5"/>
  
  <!-- Subtle Orbital Ring -->
  <ellipse cx="32" cy="32" rx="24" ry="10" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" transform="rotate(-25 32 32)"/>
  
  <!-- Celestial Sparkle -->
  <polygon points="46,18 47.5,21.5 51,23 47.5,24.5 46,28 44.5,24.5 41,23 44.5,21.5" fill="#F7E2A9" opacity="0.8"/>
  
  <!-- Monogram 'S' -->
  <text x="32" y="42" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="34" font-weight="600" fill="url(#goldGrad)" text-anchor="middle">S</text>
</svg>
